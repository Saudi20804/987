<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah & Asmaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --main-pink: #ff4d6d; --dark-pink: #c2185b; --bg-light: #fff0f3; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Cairo', sans-serif; overflow: hidden; color: white; }

        /* الشاشة الافتتاحية */
        #start-overlay {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .start-btn {
            padding: 15px 40px; border: 3px solid var(--main-pink); border-radius: 50px;
            color: var(--main-pink); font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); animation: pulse 1.5s infinite;
        }

        #intro-page {
            position: fixed; inset: 0; background: #000; display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 5000;
        }

        /* تعديل الأسماء لتكون واضحة وعريضة */
        .neon-names {
            font-family: 'Dancing Script', cursive; font-size: 4rem; font-weight: 900;
            color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px var(--main-pink), 0 0 40px var(--main-pink);
            opacity: 0; transform: scale(0.8); transition: all 1.5s ease-in-out; position: absolute;
        }
        .neon-names.show { opacity: 1; transform: scale(1.1); }
        .neon-names.move-up { transform: translateY(-180px) scale(0.7); }

        /* ضبط شكل القلب */
        #heart-container {
            width: 320px; height: 300px; margin-top: 50px; opacity: 0; transition: opacity 1.5s;
            display: flex; justify-content: center; align-items: center;
            background: var(--main-pink);
            clip-path: polygon(50% 15%, 80% 0%, 100% 20%, 100% 50%, 50% 100%, 0% 50%, 0% 20%, 20% 0%);
            padding: 20px;
        }
        #heart-inner-text {
            color: #fff; font-size: 9px; line-height: 10px; font-weight: bold;
            text-align: center; word-break: break-all; width: 100%; height: 100%; overflow: hidden;
        }

        /* الموقع الرئيسي */
        #main-content {
            display: none; background: var(--bg-light); min-height: 100vh;
            color: #333; padding: 20px; text-align: center; overflow-y: auto;
        }
        .card {
            background: #fff; border-radius: 25px; padding: 30px; margin: 20px auto;
            max-width: 500px; box-shadow: 0 15px 35px rgba(255, 77, 109, 0.1);
            border-bottom: 5px solid var(--main-pink);
        }
        .timer-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;
        }
        .timer-item {
            background: var(--main-pink); color: #fff; padding: 10px; border-radius: 15px;
        }
        .timer-item span { font-size: 1.5rem; font-weight: 900; display: block; }
        
        .footer-text { font-weight: 700; color: var(--dark-pink); margin: 20px 0; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<audio id="bg-music" loop><source src="love.mp3" type="audio/mpeg"></audio>

<div id="start-overlay">
    <div class="start-btn">Click to Open Our World ❤️</div>
</div>

<div id="intro-page">
    <div class="neon-names" id="names">Abdullah & Asmaa</div>
    <div id="heart-container">
        <div id="heart-inner-text"></div>
    </div>
</div>

<div id="main-content">
    <div style="font-size: 50px; margin: 20px;">🌹</div>
    <div class="card">
        <h1 style="color: var(--dark-pink); font-weight: 900; margin-bottom: 15px;">يا عبدالله بقى..</h1>
        <p style="font-size: 1.2rem; line-height: 1.8;">
            عارف إن الكلمة دي سر ضحكتنا، وعارف إنك بتقوليها بدلع يجنن.. ربنا يباركلي فيكي يا أسمى وتفضلي منورة حياتي.
        </p>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 15px;">بقالنا مع بعض رسمياً:</h3>
        <div class="timer-grid">
            <div class="timer-item"><span id="d">0</span> يوم</div>
            <div class="timer-item"><span id="h">0</span> ساعة</div>
            <div class="timer-item"><span id="m">0</span> دقيقة</div>
            <div class="timer-item"><span id="s">0</span> ثانية</div>
        </div>
        <p class="footer-text">من يوم خطوبتنا (29 مارس)</p>
    </div>
