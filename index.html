<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah & Asmaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff4d6d; --text: #fff0f3; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: var(--text); font-family: 'Cairo', sans-serif; overflow: hidden; }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 3000; display: flex; justify-content: center; align-items: center;
            cursor: pointer; text-align: center;
        }

        #intro-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 2000;
        }

        .neon-names {
            font-family: 'Great Vibes', cursive; font-size: 3.2rem; color: #fff;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-shadow: 0 0 10px #fff, 0 0 20px #ff4d6d; opacity: 0;
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .neon-names.show { opacity: 1; }
        .neon-names.moving-up { top: 80px; transform: translate(-50%, -50%) scale(0.6); }

        #heart-from-text {
            width: 300px; height: 300px; color: var(--accent); 
            font-size: 0.6rem; font-weight: bold; line-height: 0.8;
            text-align: center; opacity: 0; transition: opacity 2s ease;
            margin-top: 60px; display: flex; justify-content: center; align-items: center;
            word-break: break-all; clip-path: polygon(50% 15%, 85% 15%, 100% 35%, 100% 70%, 50% 100%, 0% 70%, 0% 35%, 15% 15%);
        }

        #main-site { opacity: 0; visibility: hidden; transition: 1.5s; background: #fff; min-height: 100vh; overflow-y: auto; color: #333; text-align: center; padding: 20px; }
        .pink-card { background: #fff0f3; border: 2px dashed #ff4d6d; border-radius: 20px; padding: 20px; margin: 20px auto; max-width: 400px; }
        .counter-box { background: #ff4d6d; color: #fff; border-radius: 15px; padding: 15px; margin: 20px auto; display: flex; justify-content: space-around; max-width: 400px; }
        .btn-love { background: #ff4d6d; color: #fff; border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<audio id="love-song" loop><source src="love.mp3" type="audio/mpeg"></audio>

<div id="start-overlay">
    <div style="color: #ff4d6d; border: 2px solid #ff4d6d; padding: 15px 40px; border-radius: 50px; font-weight: bold;">
        Click to Start Our Story ❤️
    </div>
</div>

<div id="intro-page">
    <div class="neon-names" id="names-display">Abdullah & Asmaa</div>
    <div id="heart-from-text"></div>
</div>

<div id="main-site">
    <div style="font-size: 50px;">❤️</div>
    <div class="pink-card">
        <h2 style="color: #c2185b;">"يا عبدالله بقى.."</h2>
        <p style="color: #ff4d6d; font-weight: bold; margin: 10px 0;">.. كدا يعني! 😂</p>
        <p>عارف إنك بتقوليها كتير، بس والله طالعة منك زي العسل يا أسمى!</p>
    </div>

    <div style="color: #c2185b; font-weight: bold;">بقالنا مع بعض رسمياً (من يوم 29/3):</div>
    <div class="counter-box" id="timer">
        <div><span id="days">0</span><br><small>يوم</small></div>
        <div><span id="hours">0</span><br><small>ساعة</small></div>
        <div><span id="mins">0</span><br><small>دقيقة</small></div>
        <div><span id="secs">0</span><br><small>ثانية</small></div>
    </div>

    <p style="font-weight: bold; color: #c2185b; margin: 20px;">
        الوعد هو هو.. أخلص جيشي ونتجوز <br>
        ونبني أحلى بيت في سبتمبر 2027 سوا 🏠
    </p>

    <h3>بتحبيني يا أسمى؟</h3>
    <button class="btn-love" onclick="alert('وأنا كمان بموت فيكي يا أغلى حاجة في حياتي! ❤️')">أيوة طبعاً!</button>
</div>

<script>
    const song = document.getElementById('love-song');
    const heart = document.getElementById('heart-from-text');

    for (let i = 0; i < 600; i++) { heart.innerHTML += 'love you '; }

    document.getElementById('start-overlay').addEventListener('click', function() {
        this.style.display = 'none';
        document.getElementById('intro-page').style.display = 'flex';
        song.play();
        
        setTimeout(() => { document.getElementById('names-display').classList.add('show'); }, 500);
        setTimeout(() => { document.getElementById('names-display').classList.add('moving-up'); }, 3500);
        setTimeout(() => { heart.style.opacity = '1'; }, 5000);
        
        setTimeout(() => {
            document.getElementById('intro-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-page').style.display = 'none';
                document.getElementById('main-site').style.opacity = '1';
                document.getElementById('main-site').style.visibility = 'visible';
                document.body.style.overflow = 'auto';
                document.body.style.background = '#fff';
            }, 1000);
        }, 11000);
    });

    function updateTimer() {
        const start = new Date('2026-03-29T00:00:00');
        const now = new Date();
        const diff = now - start;
        document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById('mins').innerText = Math.floor((diff / (1000 * 60)) % 60);
        document.getElementById('secs').innerText = Math.floor((diff / 1000) % 60);
    }
    setInterval(updateTimer, 1000);
</script>
</body>
</html>
